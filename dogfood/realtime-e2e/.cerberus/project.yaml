project:
  name: realtime-e2e-dogfood
services:
  - name: realtime
    url: http://localhost:8989/ws/{userId}   # {userId} templated from web-actor's provisioned path param (same dev user as the bridges)
    protocol_ref: open-agents
actors:
  - name: web-actor
    credentials:
      token: demo_token   # static dev backdoor for the WS query param
      # email/password seed the browser-leg UI login (POST /api/auth/login
      # returns the token + refreshToken pair the web app's WS gate needs —
      # see internal/head/agent/browser_session.go). The WS token above is
      # unaffected.
      email: dev@openagents.local
      password: dev123456
    auth:
      login:
        method: POST
        path: /api/dev/setup
        body:
          plan: pro   # feature-gated routes (a2a/custom_rules/analytics) 403 a free-plan user; the sweep needs the gates open
        headers:
          Origin: http://localhost:8989   # CSRF middleware rejects POSTs without an Origin header
      # token_from omitted on purpose: provisioning-only flow (captures userId below)
      inject_as: "Authorization: Bearer {token}"
      path_params:
        userId: config.userId
      http_login:
        method: POST
        path: /api/dev/login
        body: {}
        headers:
          Origin: http://localhost:8989
      http_token_from: token
  # Admin JWT for the /api/admin route block. Two-step like web-actor:
  # /api/dev/setup seeds the user (role:'admin' needs open-agents >= 5e9c3b1;
  # the old /api/auth/dev/setup superadmin endpoint was removed in d6e5390),
  # then /api/dev/login returns the JWT. adminMiddleware reads the role from
  # the DB by JWT sub, so the token itself carries no role claim. A DISTINCT
  # email is required -- the default address already exists as a plain 'user'.
  - name: admin-actor
    credentials:
      email: admin@openagents.local
      password: admin123456
    auth:
      login:
        method: POST
        path: /api/dev/setup
        body:
          email: "{email}"
          password: "{password}"
          plan: pro
          role: admin
        headers:
          Origin: http://localhost:8989
      # token_from omitted on purpose: provisioning-only flow (mirrors web-actor)
      inject_as: "Authorization: Bearer {token}"
      http_login:
        method: POST
        path: /api/dev/login
        body:
          email: "{email}"
          password: "{password}"
        headers:
          Origin: http://localhost:8989
      http_token_from: token
  # Real bridge devices. Each pairs via the dev backdoor (new device under the
  # SAME dev user, so the web actor shares their DO room), runs in an isolated
  # HOME (bridge config lives at $HOME/.open-agents-bridge), and its deviceId
  # is captured for {{bridge.role}} send-body routing. Expanded via replicas
  # (index from 1): bridge-pty-1..3 — per-instance variance rides the
  # {{actor.name}} template, so paired-device rows keyed by name stay valid.
  - name: bridge-pty
    credentials: {}
    fidelity: real-process
    replicas: 3
    process:
      workdir: "../../../open-agents/bridge"
      setup: ["./build/open-agents-bridge", "pair", "--dev", "--server", "http://localhost:8989", "-n", "{{actor.name}}"]
      start: ["./build/open-agents-bridge", "start", "-d", "{{actor.name}}"]
      env:
        HOME: "{{runtime.dir}}/{{actor.name}}-home"   # isolate .open-agents-bridge/config.json per instance
        PATH: "{{runtime.dir}}/../../shim:{{env.PATH}}"   # deterministic claude shim first: zero-LLM claude-pty sessions
      capture_file: "{{runtime.dir}}/{{actor.name}}-home/.open-agents-bridge/config.json"
      capture_json:
        deviceId: "devices.{{actor.name}}.deviceId"
      ready_pattern: "Connected to server successfully"
      ready_timeout: 30s
  # Real-ACP bridge: same pairing discipline but WITHOUT the shim dir on
  # PATH — its `npx` is real, so cliType "claude" resolves to the real
  # @agentclientprotocol/claude-agent-acp chain and a REAL CLI + real LLM
  # (env: ANTHROPIC_BASE_URL/AUTH_TOKEN inherited from the dogfood env).
  # The replica bridges above run the fake ACP agent via shim/npx for the
  # deterministic layer.
  - name: bridge-acp-real
    credentials: {}
    fidelity: real-process
    process:
      workdir: "../../../open-agents/bridge"
      setup: ["./build/open-agents-bridge", "pair", "--dev", "--server", "http://localhost:8989", "-n", "bridge-acp-real"]
      start: ["./build/open-agents-bridge", "start", "-d", "bridge-acp-real"]
      env:
        HOME: "{{runtime.dir}}/bridge-acp-real-home"
        # Harmless stubs for every OTHER CLI: startup detection must not
        # launch the real desktop apps (kiro!) from this actor. npx stays
        # REAL — the ACP leg runs the real claude-agent-acp chain.
        PATH: "{{runtime.dir}}/../../shim-acp:{{env.PATH}}"
      capture_file: "{{runtime.dir}}/bridge-acp-real-home/.open-agents-bridge/config.json"
      capture_json:
        deviceId: "devices.bridge-acp-real.deviceId"
      ready_pattern: "Connected to server successfully"
      ready_timeout: 60s
settings:
  max_duration: 90m   # mission-orchestration case alone runs ~4-6min; run30 (1766 verdicts, http-route v2) spent 45m with judging truncated at the budget wall — full judge needs the extra headroom
  confidence_threshold: 0.7
  ai_budget:
    # Scaled for http-route-generator v2 case volume: run15 (~700 verdicts)
    # spent ~711K (~1K/verdict all-in); run30 tripled verdicts to 1766 and
    # exhausted 900K with 170 verdicts on step-status fallback plus
    # repair/reflexion aborted. 2.2M still starved the judging tail (run33:
    # 92 fallbacks at 2195K; run35: 90 at 2194K) — 2.5M buys the tail.
    session_total_tokens: 2500000
    per_call_limit: 10000
