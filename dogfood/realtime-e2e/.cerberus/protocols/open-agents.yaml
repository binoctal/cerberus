framing: json
type_path: type
auth:
  strategy: query
  param: token
  credential_ref: web-actor
roles:
  web:
    credential_ref: web-actor
    params:
      type: web
    handshake:
      # device:online is the signal the DO pushes to web when a bridge joins.
      await_type: device:online
      timeout: 5
      optional: true
  # Both bridge roles are bound to REAL bridge processes (fidelity:
  # real-process): process_bound forbids executor-side ws_connect as them
  # (the actor holds no token — the tc-004 LLM case failed every run at
  # injectAuth), the deterministic generators never connect as them, and
  # {{bridge.deviceId}} / {{bridge2.deviceId}} resolve from each real actor's
  # captured pairing config at send time.
  bridge:
    credential_ref: bridge-pty-1
    process_bound: true
    claims: [ws-relay-messaging, multi-device-orchestration]
    # ACP deterministic layer: cliType "claude" on these devices hits the
    # fake ACP agent (shim/npx first on their PATH).
    acp_cli: claude
    params:
      type: bridge
      deviceId: "{deviceId}"
    request_payload:
      session:start:
        deviceId: "{{bridge.deviceId}}"
      # The sync handlers type-assert these payload fields as arrays and
      # silently skip (no ack) when absent — empty arrays satisfy them.
      rules:sync:
        rules: "[]"
      scanner:rules:sync:
        rules: "[]"
      mcp:sync:
        servers: "{}"
      # Unknown sessionId deterministically provokes the negative ack.
      session:resume:
        sessionId: cerberus-resume-miss
      # claude-pty shim + /tmp keep session creation on the success path.
      session:resume-with-context:
        cliType: claude-pty
        workDir: /tmp
        originalSessionId: cerberus-resume-ctx-miss
      scanner:toggle:
        enabled: "false"
      device:listDir:
        requestId: cerberus-listdir
        path: /tmp
    # Declarative request-response family the REAL bridge answers itself
    # (bridge handleMessage + DO ack whitelist). Drives realResponderCases.
    responses:
      config:sync: config:synced
      rules:sync: rules:synced
      prompts:sync: prompts:synced
      mcp:sync: mcp:synced
      mcp:list: mcp:list_response
      storage:sync: storage:synced
      session:resume: session:resume:failed
      session:resume-with-context: session:resumed-with-context
      scanner:toggle: scanner:status
      scanner:rules:sync: scanner:rules:synced
      device:listDir: device:listDirResult
  # HTTP-only role: never connects over WS; exists so httpRouteCases can
  # AuthRole-inject the admin-actor's superadmin JWT on /api/admin routes.
  admin:
    credential_ref: admin-actor
    http_only: true
  bridge2:
    credential_ref: bridge-pty-2
    process_bound: true
    claims: [ws-relay-messaging, multi-device-orchestration]
    acp_cli: claude
    params:
      type: bridge
      deviceId: "{deviceId}"
    request_payload:
      session:start:
        deviceId: "{{bridge2.deviceId}}"
  # Third replica (replicas: 3 expansion): same shape as bridge2 — its
  # reale2e/realresp cases supply the third distinct device identity the
  # multi-device-orchestration cardinality bar (3) counts.
  bridge3:
    credential_ref: bridge-pty-3
    process_bound: true
    claims: [ws-relay-messaging, multi-device-orchestration]
    acp_cli: claude
    params:
      type: bridge
      deviceId: "{deviceId}"
    request_payload:
      session:start:
        deviceId: "{{bridge3.deviceId}}"
  # Real-ACP layer: this device's npx is real — the acpreal case routes a
  # real LLM prompt through the ACP adapter here.
  bridge-acp:
    credential_ref: bridge-acp-real
    process_bound: true
    acp_cli: claude
    acp_real: true
    params:
      type: bridge
      deviceId: "{deviceId}"
    request_payload:
      session:start:
        deviceId: "{{bridge-acp.deviceId}}"
