http_auth_middlewares:
    - use:/api/*
ui:
    base_url: http://localhost:5183
    locale: en
    auth_actor: web-actor
    assertions:
        - id: missions-conn-status
          route: /dashboard/missions
          target: text=Connected
          expectation: text_present
          timeout: 15
        - id: missions-device-counter
          route: /dashboard/missions
          target: text=devices online
          expectation: text_present
          timeout: 15
        - id: missions-list-renders
          route: /dashboard/missions
          target: css=aside
          expectation: element_visible
        - id: devices-page-populated
          route: /dashboard/devices
          target: text=dev-device
          expectation: element_count>=1
          timeout: 15
        - id: missions-device-selector-count
          route: /dashboard/missions
          target: text={{case.onlineCount}} devices online
          expectation: text_present
          timeout: 15
          from_api:
            method: GET
            path: /api/missions/online-devices
            auth_role: web
            capture:
                length:devices: onlineCount
        - id: dashboard-home-quick-actions
          route: /dashboard
          target: text=Start a session
          expectation: text_present
          timeout: 15
        - id: approvals-keyboard-hint
          route: /dashboard/approvals
          target: 'text=Shortcuts: Enter to approve, Esc to deny, arrow keys to navigate'
          expectation: text_present
          timeout: 15
        - id: agents-page-title
          route: /dashboard/agents
          target: text=Custom Agents
          expectation: text_present
          timeout: 15
        - id: logs-page-title
          route: /dashboard/logs
          target: text=Logs Center
          expectation: text_present
          timeout: 15
        - id: search-page-subtitle
          route: /dashboard/search
          target: text=Search across sessions, logs, commands and all platform content
          expectation: text_present
          timeout: 15
        - id: sessions-page-title
          route: /dashboard/sessions
          target: text=Session Management
          expectation: text_present
          timeout: 15
        - id: a2a-keys-title
          route: /dashboard/a2a-keys
          target: text=A2A API Keys
          expectation: text_present
          timeout: 15
        - id: prompt-lab-title
          route: /dashboard/prompt-lab
          target: text=Prompt Lab
          expectation: text_present
          timeout: 15
