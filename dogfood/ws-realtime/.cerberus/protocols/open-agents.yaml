framing: json
type_path: type
auth:
  strategy: query
  param: token
  credential_ref: web-actor
roles:
  web:
    credential_ref: web-actor
    params:
      type: web
    handshake:
      # device:online is the signal the DO pushes to web when a bridge joins
      # (room.ts:91-95). devices:sync only fires on web-connect IF a bridge is
      # already online (room.ts:117), so in the web-first test order web gets
      # silence until bridge joins — hence optional: true.
      await_type: device:online
      timeout: 5
      optional: true
