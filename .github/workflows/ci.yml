name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixture deps
        run: |
          cd test/fixtures/node-app && npm install --silent
          cd ../python-pkg && pip install -q -r requirements.txt

      - name: Generate fixture coverage data
        run: |
          cd test/fixtures/python-pkg && python -m pytest --cov=mymath --cov-report=json:coverage.json -v

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with slow-test detection)
        run: make slowtest

      - name: Build binary
        run: go build -o build/cerberus ./cmd/cerberus

      - name: Self-test (binary health check)
        run: ./build/cerberus selftest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
